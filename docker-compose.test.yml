version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: proofmesh-postgres-test
    environment:
      POSTGRES_USER: proofmesh_test
      POSTGRES_PASSWORD: proofmesh_test_password
      POSTGRES_DB: proofmesh_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U proofmesh_test -d proofmesh_test']
      interval: 2s
      timeout: 2s
      retries: 5
