version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: proofmesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: proofmesh
      POSTGRES_PASSWORD: proofmesh_dev_password
      POSTGRES_DB: proofmesh_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U proofmesh -d proofmesh_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
